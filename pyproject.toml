[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avins-toolkit"
version = "0.1.0"
description = "Reusable tools for crawling, PDF mining and data cleaning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Avin Prakash" }]
dependencies = [
    "httpx",
    "beautifulsoup4",
]

[project.optional-dependencies]
pdf = ["pymupdf"]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100